[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "book-rag-system"
version = "0.1.0"
description = "Production-ready RAG system for book content"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "openai==1.3.8",
    "qdrant-client==1.7.0",
    "asyncpg==0.29.0",
    "tiktoken==0.5.2",
    "python-dotenv==1.0.0",
    "pydantic==2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "httpx==0.25.2",
    "pylint==3.0.2",
    "black==23.10.1",
    "isort==5.12.0",
    "flake8==6.0.0",
    "mypy==1.7.1"
]

[tool.black]
line-length = 88
target-version = ['py311']
skip-string-normalization = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true